server:
  port: 8082

spring:
  application:
    name: excelviz
  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 50MB
  mvc:
    static-path-pattern: /**
  web:
    resources:
      static-locations: classpath:/static/

logging:
  level:
    com.example.excelviz: DEBUG
    org.springframework.web: INFO
